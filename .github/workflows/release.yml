# release: every push to main whose CI passes becomes a numbered GitHub release.
#
# Triggered by the finished `ci` run (workflow_run), not by the push itself, so a commit that fails
# CI is never released. Only a successful run of a push to main in this repository counts, and only
# while that commit is still main's tip: when several merges land close together, the older runs
# stand down and the newest one releases them all in one version.
#
# scripts/release_version.py picks the version from the commits since the last vX.Y.Z tag
# (`BREAKING CHANGE:` or [major] -> major, `feat:` or [minor] -> minor, anything else -> patch;
# the first release keeps pyproject.toml's version). It is written into pyproject.toml,
# src/omniscan/__init__.py and uv.lock, committed as "release: vX.Y.Z [skip ci]" (CI already passed
# on everything in it, and [skip ci] keeps the commit from starting another release), tagged and
# pushed. The GitHub release carries generated notes, the wheel and sdist, the packaged desktop app for
# Windows, macOS and Linux (omniscan-<os>-<arch>.zip, built by build.yml on the release commit) and a
# SHA256SUMS over all of them that `omniscan update` verifies downloads against.
#
# Run by hand from the Actions tab to release main now, optionally forcing the bump level.
#
# Pushing to main uses the RELEASE_PAT secret when it is set (needed if main is protected), else the
# workflow's own token.

name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      level:
        description: "Bump level (auto: from the commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: read

jobs:
  release:
    # the branch is written out below, not taken from the event: a fork's run can name any branch
    if: >
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # on the job, after its `if`: at workflow level every finished ci run (pull requests too) would join the
    # group, and a group keeps only one pending run, so a skipped run could cancel a pending release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read # gh run list: did ci pass on the commit a manual run would release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # the tags and the commits since the last one
          # no token left in .git/config while uv lock / uv build run third-party code; only the push gets it
          persist-credentials: false

      - name: Is there anything to release?
        id: check
        env:
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          passed=1
          if [ -z "$CI_SHA" ]; then # a manual run: count main's successful ci runs on this commit (fails closed)
            passed=$(gh run list --workflow ci.yml --commit "$head" --event push --status success --json databaseId --jq length)
          fi
          if [ -n "$CI_SHA" ] && [ "$CI_SHA" != "$head" ]; then
            echo "main moved on to $head since CI passed on $CI_SHA; that commit's own CI run releases both."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$tag" ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "main ($head) is already released as $tag."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$tag" ]; then
            # tagged and pushed by an earlier run whose build or publish failed: finish that release
            echo "main ($head) is tagged $tag but has no GitHub release yet; publishing it."
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "resume=${tag#v}" >> "$GITHUB_OUTPUT"
          elif [ "$passed" -eq 0 ]; then
            # a manual run: the same rule as the automatic one, only a commit whose CI passed is released
            echo "::error::ci has not passed on main ($head) yet; release it once it has."
            exit 1
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags since v8: pinned)
        if: steps.check.outputs.go == 'true' || steps.check.outputs.resume != ''

      - name: Version
        id: version
        if: steps.check.outputs.go == 'true'
        env:
          LEVEL: ${{ inputs.level || 'auto' }}
        run: |
          version=$(python3 scripts/release_version.py next --level "$LEVEL")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Commit, tag and push
        id: push
        if: steps.check.outputs.go == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE=$(git rev-parse HEAD)
          python3 scripts/release_version.py write "$VERSION"
          uv lock
          if ! git diff --quiet; then
            git commit -am "release: v$VERSION [skip ci]"
          fi
          git tag -a "v$VERSION" -m "OmniScan v$VERSION"
          # atomic: the tag never lands without the commit it names
          if ! git push --atomic "$remote" HEAD:main "v$VERSION"; then
            git fetch -q "$remote" main:refs/remotes/origin/main
            if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
              echo "::warning::main moved on while releasing v$VERSION; the newer commit's CI run releases it."
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Pushing v$VERSION to main was refused although main did not move: main's protection blocks this workflow's token. Add a RELEASE_PAT secret (a token with contents: write that may push to main)."
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Build the wheel and sdist
        if: steps.push.outputs.pushed == 'true' || steps.check.outputs.resume != ''
        run: |
          git checkout -q "v${{ steps.version.outputs.version || steps.check.outputs.resume }}"
          uv build

      - uses: actions/upload-artifact@v6
        if: steps.push.outputs.pushed == 'true' || steps.check.outputs.resume != ''
        with:
          name: omniscan-python
          path: dist/*
          if-no-files-found: error
          retention-days: 7

    outputs:
      # the version to publish (empty when there is nothing to release)
      version: ${{ (steps.push.outputs.pushed == 'true' && steps.version.outputs.version) || steps.check.outputs.resume }}

  # The packaged desktop app for every OS, built on the release commit (main's tip once the release
  # commit is pushed; build.yml checks out the default branch).
  apps:
    needs: release
    if: needs.release.outputs.version != ''
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  publish:
    needs: [release, apps]
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          mkdir -p dist
          mv artifacts/* dist/
          cd dist
          ls -la
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release create "v$VERSION" --verify-tag --title "OmniScan v$VERSION" --generate-notes dist/* SHA256SUMS
