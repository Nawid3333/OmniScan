# model-watch (card W1): weekly check that the catalog's pinned upstream Hugging Face repos are
# still current and that no new model of the watched orgs appeared. The job only compares metadata —
# it never downloads weights and never edits config/models.toml. Changes are reported on (or added
# to) an issue labelled `model-watch`; the qualification of a candidate runs on a GPU machine
# (scripts/qualify_ocr.py), not here.

name: model-watch

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  model-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Compare catalog against upstream model repos
        id: watch
        run: |
          set +e
          uv run scripts/model_watch.py
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = catalog is current, 3 = upstream changes detected; other codes fail the job
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      - name: Open or update the model-watch issue
        if: steps.watch.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create model-watch --color 5319e7 --force
          number=$(gh issue list --label model-watch --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file model-watch.md
          else
            gh issue create --title "Model watch: upstream changes" --label model-watch --body-file model-watch.md
          fi

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-watch
          path: |
            model-watch.md
            model-watch.json
