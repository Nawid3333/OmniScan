# model-watch (card W1): weekly check that the catalog's pinned upstream Hugging Face repos are
# still current and that no new model of the watched orgs appeared. The job only compares metadata —
# it never downloads weights and never edits config/models.toml. Changes are reported on (or added
# to) an issue labelled `model-watch`; the qualification of a candidate runs on a GPU machine
# (scripts/qualify_ocr.py), not here.

name: model-watch

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  model-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a normal run takes ~15 s
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags since v8: pinned)

      # --fail-on-change makes the script exit 3 on changes (without it, it exits 0 and the issue
      # step never runs); --markdown/--json write the report the issue and the artifact carry.
      # --no-project --with httpx: the script needs only httpx, not the project's GPU stack.
      - name: Compare catalog against upstream model repos
        id: watch
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # optional; empty raises no header
        run: |
          set +e
          uv run --no-project --with httpx python scripts/model_watch.py --markdown model-watch.md --json model-watch.json --fail-on-change
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = catalog is current, 3 = upstream changes detected; other codes fail the job
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            exit "$code"
          fi

      - name: Open or update the model-watch issue
        if: steps.watch.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        # Assigned to the owner and @mentioning them: that puts the issue in GitHub's
        # "Participating" notifications, which email; a bare bot issue does not.
        run: |
          gh label create model-watch --color 5319e7 --force
          { printf '@%s\n\n' "$OWNER"; cat model-watch.md; } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --label model-watch --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "Model watch: upstream changes" --label model-watch --assignee "$OWNER" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-watch
          path: |
            model-watch.md
            model-watch.json
