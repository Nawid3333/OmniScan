name: Deploy omniscan-relay

on:
  push:
    branches: [main]
    paths:
      - "relay/**"
      - ".github/workflows/relay-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set HOOK_SECRET
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOOK_SECRET: ${{ secrets.HOOK_SECRET }}
        run: echo "$HOOK_SECRET" | npx wrangler secret put HOOK_SECRET

      - name: Set CLIENT_TOKEN
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
        run: echo "$CLIENT_TOKEN" | npx wrangler secret put CLIENT_TOKEN
