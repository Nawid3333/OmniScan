# build: the packaged desktop app for every OS (scripts/build_app.py: PyInstaller, one folder with the
# desktop app and the command line, config and fonts next to them, one zip per platform), and the installer
# built from it (scripts/build_installer.py: an Inno Setup .exe on Windows, a .dmg on macOS, an AppImage on Linux).
#
# Runs on every push to main and every pull request that touches the app, and by hand. Each build is
# smoke-tested (the packaged command line starts, plans for a simulated machine, downloads the CPU runtime with
# its bundled uv and then imports torch from it) before it is zipped; each installer is installed (or mounted)
# and its command line run. Zips and installers are uploaded as workflow artifacts; release.yml attaches them to
# a release. The builds carry the `cpu` torch backend: they run on every PC, and `omniscan runtime install`
# downloads the GPU build the hardware needs.

name: build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packaging/**"
      - "scripts/build_app.py"
      - "scripts/build_installer.py"
      - "config/**"
      - "fonts/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build_app.py"
      - "scripts/build_installer.py"
      - "src/omniscan/runtime/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            key: linux-x64
          - os: windows-latest
            key: windows-x64
          - os: macos-latest
            key: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags since v8: pinned)

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libgl1

      - name: Sync (cpu + gui)
        run: uv sync --extra cpu --extra gui

      - name: Build and smoke-test
        run: uv run --with pyinstaller==6.22.3 python scripts/build_app.py --smoke

      - name: Check the zip name
        run: test -f "dist/omniscan-${{ matrix.key }}.zip" && ls -la dist/*.zip

      - uses: actions/upload-artifact@v6
        with:
          name: omniscan-${{ matrix.key }}
          path: dist/omniscan-${{ matrix.key }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build and smoke-test the installer
        run: uv run --no-sync python scripts/build_installer.py --smoke

      - uses: actions/upload-artifact@v6
        with:
          name: omniscan-installer-${{ matrix.key }}
          path: dist/OmniScan-*
          if-no-files-found: error
          retention-days: 14
