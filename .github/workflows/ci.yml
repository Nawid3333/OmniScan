# ci: lint, type-check and run the non-GPU test suite on every push, on every OS the app ships for.
# GitHub-hosted runners have no GPU of any kind, so each OS installs the `cpu` torch backend and every
# @pytest.mark.gpu test is deselected. The owner's own backend (rocm-gfx1201) gets its own Windows job so a
# broken ROCm pin shows up here, not on the owner's PC. NVIDIA (cuda), Intel (xpu) and Apple (mps) builds are
# covered by the same device-agnostic code paths and by tests that fake torch's device queries.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # runner-images.yml runs this on a new runner image, before and after
  # windows-latest moves to it.
  workflow_call:
    inputs:
      # runs the webui job (the Svelte editor needs no GPU or Windows)
      linux-runner:
        type: string
        default: ubuntu-latest
      windows-runner:
        type: string
        default: windows-latest

# A new push to a pull request cancels the run still going for its previous commit; pushes to main
# always finish. The runner inputs are in the group so runner-images.yml's two calls never cancel
# each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.linux-runner }}-${{ inputs.windows-runner }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # a stale uv.lock fails the sync instead of being re-resolved on the runner
  UV_LOCKED: "1"
  # pytest-xdist runs the suite on every core. Pinned here rather than in the dev group only because
  # the session that added it could not reach AMD's ROCm index to regenerate uv.lock (GitHub's runners
  # and the owner's PC can); move it into [dependency-groups] dev with the next `uv lock`.
  XDIST: pytest-xdist==3.8.0

jobs:
  # Lint and type check once, on Linux: none of them depends on the OS the check runs on.
  # pyright checks the code as each shipped OS sees it (sys.platform branches), so one job covers all three.
  lint:
    runs-on: ${{ inputs.linux-runner || 'ubuntu-latest' }}
    timeout-minutes: 15 # a normal run takes ~2 min
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags since v8: pinned)

      # the workflows themselves: expression and shell mistakes fail here, not on the next scheduled run
      - name: Lint workflows
        run: uvx --from actionlint-py==1.7.12.25 actionlint

      - name: Sync (cpu + gui)
        id: sync
        if: ${{ !cancelled() }}
        run: uv sync --extra cpu --extra gui

      - name: Format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check .

      - name: Lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: Type check (Linux)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pyright --pythonplatform Linux

      - name: Type check (Windows)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pyright --pythonplatform Windows

      - name: Type check (macOS)
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run pyright --pythonplatform Darwin

  test:
    strategy:
      # compare all three independently: a failure on one OS must not cancel the others
      fail-fast: false
      matrix:
        include:
          - os: ${{ inputs.linux-runner || 'ubuntu-latest' }}
          - os: ${{ inputs.windows-runner || 'windows-latest' }}
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30 # a normal run takes ~5 min; a hung one would otherwise hold the runner 6 h
    # bash everywhere (Git Bash on Windows) so quoting and `&&` mean the same on all three
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags since v8: pinned)

      # Qt's offscreen platform still links libEGL/libxkbcommon/fontconfig on Linux
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libxkbcommon0 libfontconfig1 libgl1

      - name: Sync (cpu + gui)
        run: uv sync --extra cpu --extra gui

      # --durations lists the slowest tests in the log, so a test that starts to crawl shows up
      - name: Test (non-GPU suite)
        run: uv run --with "$XDIST" pytest -m "not gpu" -n auto --durations=15

  lock:
    # uv.lock must cover every backend extra; a pyproject.toml change without `uv lock` fails here
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags since v8: pinned)

      - name: uv.lock is up to date
        run: uv lock --check

  rocm-gfx1201:
    # the owner's PC: Windows + AMD RX 9070 XT. The runner has no AMD GPU; this proves the pinned ROCm
    # wheels still install and the suite passes against that build.
    runs-on: ${{ inputs.windows-runner || 'windows-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags since v8: pinned)
        with:
          # its own cache: the test job on the same image saves the cpu build under the default key
          cache-suffix: rocm-gfx1201

      - name: Sync (rocm-gfx1201 + gui)
        run: uv sync --extra rocm-gfx1201 --extra gui

      - name: Test (non-GPU suite)
        run: uv run --with "$XDIST" pytest -m "not gpu" -n auto

  # The web UI (the Studio editor and the debug views): unit tests, type check and production build.
  webui:
    runs-on: ${{ inputs.linux-runner || 'ubuntu-latest' }}
    timeout-minutes: 15 # a normal run takes ~1 min
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
