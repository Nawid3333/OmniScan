# ci: lint, type-check and run the non-GPU test suite on every push, on this project's own backend
# (rocm-gfx1201). No OS/GPU matrix — the project targets one machine (Windows + AMD ROCm gfx1201) only;
# this runner has no AMD GPU either, so @pytest.mark.gpu tests are still deselected, same as always.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # runner-images.yml runs this on a new runner image, before and after
  # windows-latest moves to it.
  workflow_call:
    inputs:
      # runs the webui job (the Svelte editor needs no GPU or Windows)
      linux-runner:
        type: string
        default: ubuntu-latest
      windows-runner:
        type: string
        default: windows-latest

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ inputs.windows-runner || 'windows-latest' }}
    timeout-minutes: 30 # a normal run takes ~5 min; a hung one would otherwise hold the runner 6 h
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags since v8: pinned)

      - name: Sync (rocm-gfx1201 + gui)
        run: uv sync --extra rocm-gfx1201 --extra gui

      # no GPU hardware on this runner: every @pytest.mark.gpu test is deselected (they assume real
      # accelerated kernels, not a CPU-tensor substitution).
      - name: Test (non-GPU suite)
        run: uv run pytest -m "not gpu"

      - name: Lint
        run: uv run ruff format --check . && uv run ruff check .

      - name: Type check
        run: uv run pyright

  # The web UI (the Studio editor and the debug views): unit tests, type check and production build.
  webui:
    runs-on: ${{ inputs.linux-runner || 'ubuntu-latest' }}
    timeout-minutes: 15 # a normal run takes ~1 min
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
