[project]
name = "omniscan"
version = "0.1.4"
description = "GPU end-to-end manhwa/manga translator (KO/ZH/JA -> EN); Windows/macOS/Linux, NVIDIA/AMD/Intel/Apple/CPU"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.3",
    "pillow>=11.3",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "typer>=0.16",
    "rich>=14",
    "httpx>=0.28",
    "psutil>=7",
    "transformers>=5.4",
    "huggingface-hub>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opencv-python-headless>=5.0.0.93",
    "pyspellchecker>=0.8.3",  # QA: typos in the English lines (qa/typos.py), offline English dictionary, MIT
    # Pure-Python packages torch/torchvision/transformers pull in transitively (never imported by
    # omniscan itself). Listed directly, with floors matching what's already resolved on the dev
    # machine, ONLY so the `[tool.uv.sources]` pypi pins below have a requirement to attach to: uv
    # ignores a `tool.uv.sources` entry for a package that never appears in any dependency list,
    # even transitively-satisfied ones (same constraint already noted there for `extra=`-qualified
    # entries, just not limited to those). Without this, "first index with the package wins" general
    # search kept resolving them from AMD's rocm10 index instead (incomplete platform coverage there
    # broke non-rocm extras on macOS/Linux) despite the pins existing.
    "filelock>=3.32",
    "typing-extensions>=4.16",
    "sympy>=1.14",
    "mpmath>=1.3",
    "networkx>=3.6",
    "jinja2>=3.1",
    "markupsafe>=3.0",
    "fsspec>=2026.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "pyright>=1.1.403",
    "pre-commit>=4.2",
]

[project.scripts]
omniscan = "omniscan.cli:app"

# torch/torchvision are picked per machine: exactly one backend extra (`uv sync --extra <name>`;
# `[tool.uv.conflicts]` below refuses more than one at a time — only the machine's operator knows its GPU):
#   rocm-gfx1201  AMD RX 9070 series (gfx1201), ROCm 10 — the owner's PC, the only one benchmarked on real hardware
#   cuda          NVIDIA (CUDA 12.9 wheels), Windows and Linux
#   xpu           Intel Arc / Core Ultra graphics (oneAPI), Windows and Linux
#   mps           Apple Silicon (the default PyPI macOS wheel already includes MPS)
#   cpu           any machine without a supported GPU (slow, but everything runs)
# `omniscan.gpu.device.resolve_device("auto")` then picks the best device the installed build can reach.
[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.10,<7",
]
rocm-gfx1201 = [
    # ROCm 10 PyTorch for the RX 9070 XT (gfx1201) — served by the "rocm10" index below
    "torch[device-gfx1201]==2.13.0+rocm10.0.0",
    "torchvision[device-gfx1201]==0.28.0+rocm10.0.0",
]
cpu = [
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
]
cuda = [
    # NVIDIA, CUDA 12.9 wheels (the "pytorch-cuda" index below); a different driver may need a different
    # index tag (e.g. .../whl/cu130) — change that one URL, nothing else. >=2.13: torch<=2.12.1 has a known
    # torch.jit.script memory-corruption CVE, fixed in 2.13.0.
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
]
xpu = [
    # Intel GPUs (Arc A/B series, Core Ultra iGPU) through PyTorch's native XPU backend ("pytorch-xpu" index)
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
    # torch+xpu needs a triton-xpu build that only the xpu index carries (PyPI stops at 3.3.0b1); listed so
    # the source pin below can route it there (the index is explicit, so uv would otherwise never look)
    "triton-xpu; sys_platform == 'linux'",
]
mps = [
    # Apple Silicon: the default PyPI wheel already includes MPS support, no special index needed
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscan"]

# AMD lists triton (Linux-only wheels) as an unconditional torch dependency; Windows has no triton and does
# not need it (only torch.compile does), so require it on Linux only. Keeps uv.lock installable on Windows.
[tool.uv]
override-dependencies = ["triton; sys_platform == 'linux'"]
# setuptools: every torch build resolves it to 81.0.0 (GHSA-h35f-9h28-mq5c / CVE-2026-59890, a MANIFEST.in
# exclusion bypass on macOS sdists, patched in 83.0.0; Dependabot alert #1, dismissed 2026-09-24) — NOT
# overridden here. AMD's rocm10 index only carries 81.0.0 itself, so forcing >=83.0.0 makes
# omniscan[rocm-gfx1201] (this project's own machine) unresolvable entirely; the
# advisory only matters when *building/publishing* an sdist on a case-insensitive-normalizing macOS
# filesystem, which this project never does (no sdist is ever published). Accepted, not fixed.

# Exactly one torch backend at a time — see the comment on [project.optional-dependencies] above. uv
# refuses a sync/lock that asks for more than one of these together instead of silently picking one.
conflicts = [
    [
        { extra = "rocm-gfx1201" },
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "xpu" },
        { extra = "mps" },
    ],
]

[tool.uv.sources]
# torch/torchvision are routed by extra to the matching index; mps has no entry on purpose (macOS wheels
# come from the default `pypi` index, already MPS-capable). rocm10 is kept as a general (non-
# explicit) index below rather than `explicit = true`: torch[device-gfx1201] pulls in several transitive
# ROCm SDK/device packages (rocm-sdk-core, amd-torch-device-gfx1201, ...) that are never listed directly in
# `[project.optional-dependencies]`, so they cannot carry an `extra = "rocm-gfx1201"` source mapping (uv
# requires the named package to appear in that extra's own dependency list) — they can only be found via
# rocm10 participating in general index search, exactly as before this table existed.
torch = [
    { index = "rocm10", extra = "rocm-gfx1201" },
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = [{ index = "pytorch-xpu", extra = "xpu" }]
torchvision = [
    { index = "rocm10", extra = "rocm-gfx1201" },
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
    { index = "pytorch-xpu", extra = "xpu" },
]

# rocm10 mirrors the *entire* pure-Python dependency closure needed to build torch/torchvision, not just
# its genuinely ROCm-specific packages — every one of torch's own declared dependencies below is really
# hosted there (confirmed directly: `uv pip install "<pkg>===9999" --index-url .../rocm/whl-next/` reports
# "found on" for each). "First index that has it wins" general search kept silently picking rocm10's copy
# over PyPI's for every extra, not just rocm-gfx1201 (no macOS wheel for any of them there), discovered one
# CI failure at a time (numpy, then pillow, then markupsafe); pinned to PyPI once and for all instead. `rocm10` deliberately
# stays non-explicit and `triton` is deliberately untouched here (see the override-dependencies comment
# above): an earlier attempt to instead mark rocm10 `explicit = true` and enumerate every transitive
# package (including triton) silently swapped the Linux fork's triton from AMD's ROCm-specific build to a
# generic PyPI one — unverifiable on this Windows-only machine and too risky to ship blind. This narrower
# fix touches only the pure-Python packages actually confirmed to collide, leaves rocm10's own
# general-search behaviour (and triton) exactly as before.
# Every package below is also listed in `[project.dependencies]` (with a floor matching what's already
# resolved) even though omniscan never imports most of them directly: uv silently ignores a
# `tool.uv.sources` entry for a package that isn't a requirement anywhere in the project's own metadata,
# even one satisfied only transitively (verified: adding the entry alone, with no matching dependency
# line, left markupsafe resolving from rocm10 regardless — `uv lock -v` showed it never even queried
# pypi). The dependency line's only purpose is giving the source pin something to attach to.
numpy = [{ index = "pypi" }]
pillow = [{ index = "pypi" }]
filelock = [{ index = "pypi" }]
typing-extensions = [{ index = "pypi" }]
sympy = [{ index = "pypi" }]
mpmath = [{ index = "pypi" }]
networkx = [{ index = "pypi" }]
jinja2 = [{ index = "pypi" }]
markupsafe = [{ index = "pypi" }]
fsspec = [{ index = "pypi" }]
pyspellchecker = [{ index = "pypi" }]  # pure Python, only on PyPI: never look it up on rocm10

# AMD ROCm 10 wheel index (torch, torchvision, triton, rocm-sdk-*, amd-*-device-gfx1201) for the
# rocm-gfx1201 extra. Not `explicit`, same as before this table existed: its transitive ROCm SDK/device
# packages have no direct entry in [project.optional-dependencies] to attach an explicit source to (see the
# comment above), so they need general index search to be found at all.
[[tool.uv.index]]
name = "rocm10"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["docs/**/*.md"]  # task cards show signatures with `...` bodies; not Python to be reformatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = [
    "E501",                          # line length is the formatter's job; long docstrings are fine
    "RUF001", "RUF002", "RUF003",    # CJK full-width punctuation is legitimate data in this project
]

[tool.ruff.lint.per-file-ignores]
"src/omniscan/gui/**" = ["N802"]  # Qt handler names (paintEvent, resizeEvent, …) are camelCase

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "gpu: needs a real GPU (any supported backend)",
    "network: needs network / Ollama",
]
