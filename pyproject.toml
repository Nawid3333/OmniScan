[project]
name = "omniscan"
version = "0.1.0"
description = "GPU end-to-end manhwa/manga translator (KO/ZH/JA -> EN); Windows/macOS/Linux, AMD/NVIDIA/Apple/CPU"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.3",
    "pillow>=11.3",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "typer>=0.16",
    "rich>=14",
    "httpx>=0.28",
    "psutil>=7",
    "transformers>=5.4",
    "huggingface-hub>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "opencv-python-headless>=5.0.0.93",
    # Pure-Python packages torch/torchvision/transformers pull in transitively (never imported by
    # omniscan itself). Listed directly, with floors matching what's already resolved on the dev
    # machine, ONLY so the `[tool.uv.sources]` pypi pins below have a requirement to attach to: uv
    # ignores a `tool.uv.sources` entry for a package that never appears in any dependency list,
    # even transitively-satisfied ones (same constraint already noted there for `extra=`-qualified
    # entries, just not limited to those). Without this, "first index with the package wins" general
    # search kept resolving them from AMD's rocm10 index instead (incomplete platform coverage there
    # broke non-rocm extras on macOS/Linux) despite the pins existing.
    "filelock>=3.32",
    "typing-extensions>=4.16",
    "sympy>=1.14",
    "mpmath>=1.3",
    "networkx>=3.6",
    "jinja2>=3.1",
    "markupsafe>=3.0",
    "fsspec>=2026.7",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "pyright>=1.1.403",
    "pre-commit>=4.2",
]

[project.scripts]
omniscan = "omniscan.cli:app"

# torch/torchvision are picked per machine: exactly one of these four (`uv sync` needs `--extra <name>`;
# `[tool.uv.conflicts]` below refuses more than one at a time — there is no safe default, since only the
# machine's operator knows its own GPU). "rocm-gfx1201" is this project's own dev machine (RX 9070 XT) and
# the only one benchmarked on real hardware (docs/benchmarks/windows-native.md); cpu/cuda/mps are
# best-effort and not yet verified on real hardware other than gfx1201 — see docs/PLAN.md P1/P2.
[project.optional-dependencies]
gui = [
    "pyside6-essentials>=6.10,<7",
]
rocm-gfx1201 = [
    # ROCm 10 PyTorch for the RX 9070 XT (gfx1201) — served by the "rocm10" index below
    "torch[device-gfx1201]==2.13.0+rocm10.0.0",
    "torchvision[device-gfx1201]==0.28.0+rocm10.0.0",
]
cpu = [
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
]
cuda = [
    # NVIDIA, CUDA 12.9 wheels (the "pytorch-cuda" index below); a different driver/toolkit version may
    # need a different index tag (e.g. .../whl/cu126) — change that one URL, nothing else. >=2.13 (not a
    # looser floor): torch<=2.12.1 has a known torch.jit.script memory-corruption CVE, fixed in 2.13.0
    # (cu128 tops out at 2.11.0, which is why cu129 is the index used here, not cu128).
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
]
mps = [
    # Apple Silicon: the default PyPI wheel already includes MPS support, no special index needed
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omniscan"]

# AMD lists triton (Linux-only wheels) as an unconditional torch dependency; Windows has no triton and does
# not need it (only torch.compile does), so require it on Linux only. Keeps uv.lock installable on Windows.
[tool.uv]
override-dependencies = ["triton; sys_platform == 'linux'"]
# setuptools: every torch build resolves it to 81.0.0 (GHSA-5rjg-fvgr-3xxf, a MANIFEST.in exclusion bypass
# on macOS sdists, patched in 83.0.0) — NOT overridden here. AMD's rocm10 index only carries 81.0.0 itself,
# so forcing >=83.0.0 makes omniscan[rocm-gfx1201] (this project's own machine) unresolvable entirely; the
# advisory only matters when *building/publishing* an sdist on a case-insensitive-normalizing macOS
# filesystem, which this project never does (no sdist is ever published). Accepted, not fixed.

# Exactly one torch backend at a time — see the comment on [project.optional-dependencies] above. uv
# refuses a sync/lock that asks for more than one of these together instead of silently picking one.
conflicts = [
    [
        { extra = "rocm-gfx1201" },
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "mps" },
    ],
]

[tool.uv.sources]
# torch/torchvision themselves are routed by extra to the matching index. rocm10 stays a general (non-
# explicit) index below rather than `explicit = true`: torch[device-gfx1201] pulls in several transitive
# ROCm SDK/device packages (rocm-sdk-core, amd-torch-device-gfx1201, ...) that are never listed directly in
# `[project.optional-dependencies]`, so they cannot carry an `extra = "rocm-gfx1201"` source mapping (uv
# requires the named package to appear in that extra's own dependency list) — they can only be found via
# rocm10 participating in general index search, exactly as before this table existed.
torch = [
    { index = "rocm10", extra = "rocm-gfx1201" },
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
torchvision = [
    { index = "rocm10", extra = "rocm-gfx1201" },
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cuda", extra = "cuda" },
]
# mps has no entry above on purpose: macOS wheels come from the default `pypi` index below, already MPS-capable

# rocm10 mirrors the *entire* pure-Python dependency closure needed to build torch/torchvision, not just
# their genuinely ROCm-specific packages — every one of torch's own declared dependencies below is really
# hosted there (confirmed directly: `uv pip install "<pkg>===9999" --index-url .../rocm/whl-next/` reports
# "found on" for each), each with incomplete platform coverage (no macOS wheel for any of them, discovered
# one CI failure at a time: numpy, then pillow, then markupsafe). "First index that has it wins" general
# search kept silently picking rocm10's copy over PyPI's for every extra, not just rocm-gfx1201, breaking
# `uv sync --extra cpu` on macOS entirely. Pin the whole closure to PyPI at once instead of continuing to
# discover the rest one CI run at a time. `rocm10` deliberately stays non-explicit and `triton` is
# deliberately untouched here (see the override-dependencies comment above): an earlier attempt to instead
# mark rocm10 `explicit = true` and enumerate every transitive package (including triton) silently swapped
# the Linux fork's triton from AMD's ROCm-specific build to a generic PyPI one — unverifiable on this
# Windows-only machine and too risky to ship blind. This narrower fix touches only the pure-Python packages
# actually confirmed to collide, leaves rocm10's own general-search behaviour (and triton) exactly as before.
# Every package below is also listed in `[project.dependencies]` (with a floor matching what's already
# resolved) even though omniscan never imports most of them directly: uv silently ignores a
# `tool.uv.sources` entry for a package that isn't a requirement anywhere in the project's own metadata,
# even one satisfied only transitively (verified: adding the entry alone, with no matching dependency
# line, left markupsafe resolving from rocm10 regardless — `uv lock -v` showed it never even queried
# pypi). The dependency line's only purpose is giving the source pin something to attach to.
numpy = [{ index = "pypi" }]
pillow = [{ index = "pypi" }]
filelock = [{ index = "pypi" }]
typing-extensions = [{ index = "pypi" }]
sympy = [{ index = "pypi" }]
mpmath = [{ index = "pypi" }]
networkx = [{ index = "pypi" }]
jinja2 = [{ index = "pypi" }]
markupsafe = [{ index = "pypi" }]
fsspec = [{ index = "pypi" }]

# AMD ROCm 10 wheel index first (torch, torchvision, triton, rocm-sdk-*, amd-*-device-gfx1201) — this
# project's own dev machine (RX 9070 XT / gfx1201). Not `explicit`, same as before this table existed: its
# transitive ROCm SDK/device packages have no direct entry in [project.optional-dependencies] to attach an
# explicit source to (see the comment above), so they need general index search to be found at all.
[[tool.uv.index]]
name = "rocm10"
url = "https://stable.repo.amd.com/rocm/whl-next/"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["docs/**/*.md"]  # task cards show signatures with `...` bodies; not Python to be reformatted

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]
ignore = [
    "E501",                          # line length is the formatter's job; long docstrings are fine
    "RUF001", "RUF002", "RUF003",    # CJK full-width punctuation is legitimate data in this project
]

[tool.ruff.lint.per-file-ignores]
"src/omniscan/gui/**" = ["N802"]  # Qt handler names (paintEvent, resizeEvent, …) are camelCase

[tool.pyright]
pythonVersion = "3.14"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "gpu: needs the ROCm GPU",
    "network: needs network / Ollama",
]
