# Model catalog for OmniScan: every model the app can download, with purpose, size and licence.
# The shipped app is small and the user decides what to download (owner decision 2026-09-19):
# `omniscan models list` shows these entries with their status, `models download <id>` fetches one.
#
# The three Hugging Face vision models and the LaMa file are mirrored UNCHANGED as assets of the
# GitHub release `models-v1` of Nawid3333/OmniScan (all Apache-2.0). The mirror repo is private
# today, so a 404 there makes the manager fall back to the upstream source automatically.
# Large language models come from Ollama (local pull or Ollama Cloud through the local daemon).
#
# Override per machine in ~/.config/omniscan/models.toml — an entry there replaces the same-id
# entry here and may add new ones (same rule as the translation profiles).
#
# Fields per [[model]]: id, name, kind (vision|ocr|inpaint|llm), required (the pipeline cannot run
# without it), format (zip|file|ollama|cloud), size_mb (approximate download size), license,
# description (one sentence), used_by (config keys / profile names that use it). Per format:
# zip   -> mirror_url, sha256, bytes, upstream_repo, upstream_revision
#          (the zip holds only files under a top-level <id>/ folder and is extracted into
#          paths.models_dir, so the model lives at <models_dir>/<id>/)
# file  -> mirror_url, sha256, bytes, upstream_url, install_path (relative to paths.models_dir)
# ollama-> ollama_name (the tag to pull)
# cloud -> ollama_name (runs on Ollama Cloud through the local daemon; nothing to download,
#          needs an Ollama account)

[[model]]
id = "detector-comic-text-bubble"
name = "Text and bubble detector"
kind = "vision"
required = true
format = "zip"
size_mb = 159
license = "Apache-2.0"
description = "RT-DETR-v2 that finds speech bubbles and free text."
used_by = ["detect.repo"]
min_vram_gb = 1.0
min_ram_gb = 4
cpu_speed = "slow"
mirror_url = "https://github.com/Nawid3333/OmniScan/releases/download/models-v1/detector-comic-text-bubble.zip"
sha256 = "cccc8a235d90839428327394cc466851961dfc13bf3a6a0658739a8d08224268"
bytes = 158938404
upstream_repo = "ogkalu/comic-text-and-bubble-detector"
upstream_revision = "16e8a622f91fabc6b5b65c96d32d1183f8843546"

