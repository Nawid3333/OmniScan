# Sound-effect lexicon: onomatopoeia and mimetic words per source language (ocr/sfx.py).
#
# After OCR, a free-text region whose letters (punctuation, spaces and long-vowel marks ignored) are
# made of these words is reclassified as kind "sfx", so it is translated as an English sound effect
# and lettered like one. Repeats of a word count (쾅쾅쾅, 두근두근, ドドドド) and so do stretched
# words (쿠구구궁 is read as 쿠구궁). Add more in ~/.config/omniscan/sfx_text.toml (same layout; the
# lists are concatenated). Keep entries that are sound effects in comics, not everyday words.

[sfx_text]
