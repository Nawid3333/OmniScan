# OmniScan defaults. Override per machine in ~/.config/omniscan/config.toml
# or with env vars like OMNISCAN_GPU__VRAM_BUDGET_GIB=13. Secrets never go here.

[paths]
# library_root = "/home/limex/omniscan/library"
# work_root    = "/home/limex/omniscan/work"
# output_root  = "/home/limex/omniscan/output"

[gpu]
device = "auto"          # auto (strongest discrete GPU, else MPS, else CPU) | cpu | mps | cuda:N
vram_budget_gib = 14.5
codec = "auto"          # auto | rocjpeg | hybrid | turbo (turbo = benchmark baseline only)

[slicer]
band_min_px = 50
target_height = 3000
min_height = 1500
max_height = 6000
hard_max_height = 15000
uniform_tol = 10
max_drift = 2.0

[detect]
repo = "ogkalu/comic-text-and-bubble-detector"
threshold = 0.3
tile_px = 1280
overlap = 0.5
batch_size = 8
nms_iou = 0.5
contain_thr = 0.85
edge_penalty = 0.15
merge_bubble_text = true
reading_direction = "ltr"   # ltr | rtl (manga)

[ollama]
local_url = "http://localhost:11434"
cloud_url = "https://ollama.com"
request_timeout_s = 600.0

[ocr]
det_repo = "PaddlePaddle/PP-OCRv5_server_det_safetensors"
rec_repo = "PaddlePaddle/korean_PP-OCRv5_mobile_rec_safetensors"
tile_px = 1280
overlap = 0.25
det_threshold = 0.3
box_threshold = 0.6
unclip_ratio = 1.5
min_size = 3
rec_batch_size = 64
line_pad_px = 3
assign_min_ioa = 0.5
region_pad_px = 8
nms_iou = 0.5
low_conf = 0.85
drop_conf = 0.5
lang = "ko"

[inpaint]
pad_px = 8
mask_dilate_px = 3
flat_tol = 8.0
min_ring_px = 48
lama_url = "https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt"
lama_sha256 = "344c77bbcb158f17dd143070d1e789f38a66c04202311ae3a258ef66667a9ea9"
lama_file = "big-lama.pt"
lama_window = 512
lama_dilate_px = 4
lama_context_px = 32
glyph_mask = true
glyph_grow = 1.0
glyph_grow_sfx = 1.6
glyph_grow_min_px = 2
glyph_grow_max_px = 12
glyph_grow_max_sfx_px = 32
glyph_ring_px = 4

[typeset]
min_px = 14
max_px = 48
line_spacing = 1.15
margin_px = 6
free_grow = 0.10
stroke_free_px = 3
stroke_sfx_px = 5
style = "auto"
uppercase = "auto"
bubble_padding = 0.12
size_spread = 1.15
shout_spread = 1.35
hyphenate = true
sfx_max_px = 240

[sfx]
detect = true
max_chars = 8
lexicon_size_ratio = 1.0
size_ratio = 2.0
size_max_chars = 3
mode = "replace"

[export]
jpeg_quality = 95
subsampling = "444"
